<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HR Portal</title>
<style>
:root{
  --brand:#1E4FA3; --brand-ink:#fff; --brand-soft:#EAF0FA; --brand-line:#C9D7EF;
  --navy:#131C3F; --navy-2:#1d2858;
  --ink:#1B2430; --ink-2:#4A5565; --ink-3:#7A8494;
  --line:#E3E7EC; --canvas:#F4F6F8; --surface:#fff;
  --ok:#1E8A5A; --ok-soft:#E4F4EB; --warn:#A3650E; --warn-soft:#FCF1DE;
  --bad:#B53A2B; --bad-soft:#FBE8E5; --info:#2D6CDF; --info-soft:#E7EFFC; --muted-soft:#EEF0F3;
  --side:240px; --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--canvas)}
h1,h2,h3{margin:0;font-weight:650}
a{color:var(--brand);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}

/* layout */
.app{display:flex;min-height:100vh}
.side{width:var(--side);background:var(--navy);color:#cfd6ee;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:30;transition:transform .2s}
.brand{padding:18px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .name{font-weight:650;color:#fff;line-height:1.2;word-break:break-word}
.logo{width:44px;height:44px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;background:#fff;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain}
.logo.ph{border:1.5px dashed rgba(255,255,255,.45);background:transparent;color:rgba(255,255,255,.7);font-size:10px;letter-spacing:.08em;font-weight:600}
.nav{padding:10px 8px;overflow:auto;flex:1}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:#cfd6ee;margin-bottom:2px}
.nav a:hover{background:var(--navy-2);color:#fff}
.nav a.on{background:var(--brand);color:#fff}
.nav .sec{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#8390bd;padding:12px 12px 4px}
.side .foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:#8f9bc6}
.main{margin-left:var(--side);flex:1;min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:14px 24px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top h1{font-size:19px}
.top .sub{color:var(--ink-3)}
.top .sp{flex:1}
.burger{display:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}
.who{display:flex;align-items:center;gap:10px;text-align:right}
.who .n{font-weight:600;line-height:1.2}.who .r{font-size:12px;color:var(--ink-3)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-weight:650;display:flex;align-items:center;justify-content:center}
.page{padding:22px 24px;max-width:1240px}

/* components */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px}
.card>.hd{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card>.hd h2{font-size:15px}
.card>.hd .sp{flex:1}
.card>.bd{padding:16px 18px}
.card.pad0>.bd{padding:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{padding:16px 18px}.stat .k{color:var(--ink-3);font-size:12px;text-transform:uppercase;letter-spacing:.06em}.stat .v{font-size:26px;font-weight:650;margin-top:2px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:550}
.btn:hover{border-color:var(--brand-line);background:var(--brand-soft)}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}.btn.pri:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.bad{color:var(--bad);border-color:#efc4be}.btn.bad:hover{background:var(--bad-soft)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:wait}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--muted-soft);color:var(--ink-2)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.info{background:var(--info-soft);color:var(--info)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);background:#fafbfc;font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--brand-soft)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow:auto}
.empty{padding:28px;text-align:center;color:var(--ink-3)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tabs a{padding:9px 14px;border-bottom:2px solid transparent;color:var(--ink-2);font-weight:550;cursor:pointer}
.tabs a.on{color:var(--brand);border-color:var(--brand)}
.muted{color:var(--ink-3)}.small{font-size:12.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.note{background:var(--info-soft);border:1px solid #cfdcf7;color:#274b92;border-radius:8px;padding:10px 14px;margin-bottom:14px}
.note.warn{background:var(--warn-soft);border-color:#f0dcb0;color:var(--warn)}

/* forms */
.form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 16px}
.form .full{grid-column:1/-1}
.form h3{grid-column:1/-1;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);padding-top:10px;border-top:1px solid var(--line);margin-top:6px}
.form h3:first-child{border:0;padding-top:0;margin-top:0}
label.f{display:block}
label.f>span{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:4px;font-weight:550}
label.f>span i{color:var(--bad);font-style:normal}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=month],input[type=number],input[type=time],input[type=search],select,textarea{width:100%;border:1px solid #cfd5dd;border-radius:8px;padding:8px 10px;background:#fff}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand-line);border-color:var(--brand)}
input.sm{padding:4px 8px;width:90px}

/* modal + toast */
.ov{position:fixed;inset:0;background:rgba(19,28,63,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:60}
.modal{background:#fff;border-radius:12px;width:100%;max-width:560px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal .hd{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal .hd h2{font-size:16px;flex:1}.modal .bd{padding:18px}.modal .ft{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center}
.t{background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90vw}
.t.bad{background:var(--bad)}.t.ok{background:var(--ok)}

/* auth */
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,var(--navy),#0b1130)}
.auth .box{background:#fff;border-radius:14px;padding:28px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.auth .logo{margin:0 auto 12px;width:64px;height:64px;border:1.5px dashed #b9c2d6;background:#fff;color:#8791a8}
.auth .logo.ph{border:1.5px dashed #b9c2d6;color:#8791a8}
.auth h1{text-align:center;font-size:20px}.auth .sub{text-align:center;color:var(--ink-3);margin:2px 0 18px}
.auth label.f{margin-bottom:12px}
.auth .btn{width:100%;justify-content:center;padding:10px}
.auth .links{display:flex;justify-content:space-between;margin-top:14px;font-size:13px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px}.kv dt{color:var(--ink-3)}.kv dd{margin:0}
.bar{height:8px;border-radius:99px;background:var(--muted-soft);overflow:hidden}.bar>i{display:block;height:100%;background:var(--brand)}

@media(max-width:900px){
  .side{transform:translateX(-100%)}.side.open{transform:none}
  .main{margin-left:0}.burger{display:block}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form{grid-template-columns:repeat(2,minmax(0,1fr))}
  .page{padding:16px}.top{padding:12px 16px}.who .n,.who .r{display:none}
}
@media(max-width:560px){.g2,.g3,.g4,.form{grid-template-columns:1fr}.kv{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<noscript>Please enable JavaScript to use the HR Portal.</noscript>

<!-- ============ SETUP: paste your Supabase values here (Project Settings -> API) ============ -->
<script>
const CONFIG = {
  SUPABASE_URL: 'https://YOUR-PROJECT-ID.supabase.co',
  SUPABASE_ANON_KEY: 'YOUR-ANON-PUBLIC-KEY'   // the public "anon" key ONLY. Never paste the service_role key here.
};
</script>
<!-- ======================================================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script>
'use strict';
/* ===== helpers ===== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const inr = n => '₹' + Number(n || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pd = d => d ? new Date(String(d).length <= 10 ? d + 'T00:00:00' : d) : null;
const fdate = d => d ? pd(d).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) : '—';
const ftime = t => t ? new Date(t).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true, timeZone: TZ() }) : '—';
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const TZ = () => (typeof S !== 'undefined' && S.st && S.st.timezone) || undefined;
const todayISO = () => { try { return new Date().toLocaleDateString('en-CA', { timeZone: TZ() }); } catch (_) { return iso(new Date()); } };
const monthLabel = m => new Date(String(m).slice(0, 7) + '-01T00:00:00').toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
const initials = n => (n || '?').split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));
const nn = v => (v === '' || v == null) ? null : v;
const prevMonth = () => { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1); return iso(d).slice(0, 7); };
const nextMonthStart = ym => { const [y, m] = ym.split('-').map(Number); return iso(new Date(y, m, 1)); };
const mask = a => a ? '•••• ' + String(a).slice(-4) : '—';
const ROLE_LABEL = { admin: 'Admin (HR)', manager: 'Manager', employee: 'Employee' };
const TYPE_LABEL = { full_time: 'Full-time', part_time: 'Part-time', contract: 'Contract', intern: 'Intern' };
const DOC_TYPES = ['ID proof (Aadhaar)', 'PAN card', 'Address proof', 'Passport photo', 'Educational certificate', 'Experience letter', 'Offer letter', 'Appointment letter', 'Bank proof', 'Other'];

function words(n) {
  n = Math.round(n); if (n === 0) return 'Zero';
  const a = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
  const b = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
  const two = x => x < 20 ? a[x] : b[Math.floor(x / 10)] + (x % 10 ? ' ' + a[x % 10] : '');
  const three = x => (x >= 100 ? a[Math.floor(x / 100)] + ' Hundred' + (x % 100 ? ' ' : '') : '') + (x % 100 ? two(x % 100) : '');
  const out = []; const cr = Math.floor(n / 1e7); n %= 1e7; const lk = Math.floor(n / 1e5); n %= 1e5; const th = Math.floor(n / 1e3); n %= 1e3;
  if (cr) out.push(three(cr) + ' Crore'); if (lk) out.push(two(lk) + ' Lakh'); if (th) out.push(two(th) + ' Thousand'); if (n) out.push(three(n));
  return out.join(' ');
}
function csv(rows) { return rows.map(r => r.map(v => { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(',')).join('\r\n'); }
function download(name, content, type = 'text/csv') {
  const b = new Blob([type === 'text/csv' ? '﻿' + content : content], { type: type + ';charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}
function toast(msg, kind = '') { const t = document.createElement('div'); t.className = 't ' + kind; t.textContent = msg; $('#toast').appendChild(t); setTimeout(() => t.remove(), kind === 'bad' ? 6500 : 3000); }
function modal(title, body) {
  closeModal(); const o = document.createElement('div'); o.className = 'ov'; o.id = 'modal';
  o.innerHTML = `<div class="modal"><div class="hd"><h2>${esc(title)}</h2><button class="btn sm" type="button" data-act="closeModal">✕</button></div><div class="bd">${body}</div></div>`;
  document.body.appendChild(o);
}
function closeModal() { $('#modal')?.remove(); }
const must = async p => { const { data, error } = await p; if (error) throw error; return data; };
const cnt = async q => { const { count, error } = await q; if (error) throw error; return count || 0; };
function formObj(f) { const o = {}; new FormData(f).forEach((v, k) => { o[k] = typeof v === 'string' ? v.trim() : v; }); return o; }

function fld(name, label, type = 'text', o = {}, val = '') {
  const req = o.req ? ' required' : '', star = o.req ? ' <i>*</i>' : '', cls = 'f' + (o.full ? ' full' : '');
  let inp;
  if (type === 'select') inp = `<select name="${name}"${req}>${(o.opts || []).map(([v, l]) => `<option value="${esc(v)}"${String(val ?? '') === String(v) ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
  else if (type === 'textarea') inp = `<textarea name="${name}"${req}>${esc(val)}</textarea>`;
  else inp = `<input type="${type}" name="${name}" value="${esc(val)}"${req}${o.ph ? ` placeholder="${esc(o.ph)}"` : ''}${o.step ? ` step="${o.step}"` : ''}${o.min != null ? ` min="${o.min}"` : ''}${o.max != null ? ` max="${o.max}"` : ''}>`;
  return `<label class="${cls}"><span>${esc(label)}${star}</span>${inp}</label>`;
}
const logoHtml = (st, cls = '') => st?.logo_data ? `<div class="logo ${cls}"><img alt="logo" src="${esc(st.logo_data)}"></div>` : `<div class="logo ph ${cls}">LOGO</div>`;

/* ===== state ===== */
const S = { sb: null, user: null, me: null, st: null, dir: [], lt: [], hol: [], ui: {}, tok: 0, recovery: false, brand: null };
const ACT = {}, FORM = {}, CHG = {}, PAGES = {};
const isAdmin = () => S.me?.role === 'admin';
const isMgr = () => S.me?.role === 'manager' || isAdmin();
const nameOf = id => S.dir.find(e => e.id === id)?.full_name || '—';
const codeOf = id => S.dir.find(e => e.id === id)?.emp_code || '';

async function loadBase() {
  const [st, dir, lt, hol] = await Promise.all([
    must(S.sb.from('settings').select('*').eq('id', 1).single()),
    must(S.sb.from('employee_directory').select('*').order('emp_code')),
    must(S.sb.from('leave_types').select('*').eq('active', true).order('name')),
    must(S.sb.from('holidays').select('*').order('date'))]);
  Object.assign(S, { st, dir, lt, hol });
}
async function reloadDir() { S.dir = await must(S.sb.from('employee_directory').select('*').order('emp_code')); }
async function loadMe() {
  const { data: { user } } = await S.sb.auth.getUser();
  S.user = user || null; S.me = null;
  if (!user) return;
  const me = await must(S.sb.from('employees').select('*').eq('user_id', user.id).maybeSingle());
  if (me && me.status === 'active') { S.me = me; await loadBase(); }
}

/* ===== auth screens ===== */
function authShell(inner) {
  const b = S.brand || { company_name: 'HR Portal', logo_data: null };
  return `<div class="auth"><div class="box">${b.logo_data ? `<div class="logo" style="border-style:solid;border-color:#e3e7ec"><img alt="logo" src="${esc(b.logo_data)}"></div>` : '<div class="logo ph">LOGO</div>'}
    <h1>${esc(b.company_name)}</h1><div class="sub">HR Portal</div>${inner}</div></div>`;
}
function authView(mode) {
  if (mode === 'activate') return authShell(`<form data-form="activate">
      <div class="note">First time here? Use the work email HR registered, and choose a password.</div>
      ${fld('email', 'Work email', 'email', { req: 1 })}${fld('password', 'Choose a password (min 8 characters)', 'password', { req: 1 })}${fld('password2', 'Repeat password', 'password', { req: 1 })}
      <button class="btn pri" type="submit">Activate account</button></form>
      <div class="links"><a href="#" data-act="authMode" data-m="login">← Back to login</a></div>`);
  if (mode === 'forgot') return authShell(`<form data-form="forgot">${fld('email', 'Work email', 'email', { req: 1 })}
      <button class="btn pri" type="submit">Send reset link</button></form>
      <div class="links"><a href="#" data-act="authMode" data-m="login">← Back to login</a></div>`);
  if (mode === 'recovery') return authShell(`<form data-form="newpass"><div class="note">Choose a new password.</div>
      ${fld('password', 'New password (min 8 characters)', 'password', { req: 1 })}${fld('password2', 'Repeat password', 'password', { req: 1 })}
      <button class="btn pri" type="submit">Save password</button></form>`);
  return authShell(`<form data-form="login">${fld('email', 'Work email', 'email', { req: 1 })}${fld('password', 'Password', 'password', { req: 1 })}
      <button class="btn pri" type="submit">Log in</button></form>
      <div class="links"><a href="#" data-act="authMode" data-m="activate">Activate account</a><a href="#" data-act="authMode" data-m="forgot">Forgot password?</a></div>`);
}
const setupScreen = () => `<div class="auth"><div class="box"><h1>Setup needed</h1><div class="sub">Connect the database</div>
  <p>Open <b>index.html</b> and put your Supabase <b>Project URL</b> and <b>anon public key</b> in the CONFIG block at the top, then reload.</p></div></div>`;
const noProfileView = () => authShell(`<div class="note warn">You are signed in as <b>${esc(S.user?.email)}</b>, but there is no active employee profile for this email. Please contact HR.</div>
  <button class="btn" data-act="logout">Sign out</button>`);

ACT.authMode = t => { S.ui.authMode = t.dataset.m; render(); };
ACT.logout = async () => { await S.sb.auth.signOut(); S.user = null; S.me = null; S.ui = {}; location.hash = '#/'; render(); };
ACT.closeModal = closeModal;
ACT.menu = () => $('.side')?.classList.toggle('open');

async function afterLogin() { await loadMe(); S.ui.authMode = 'login'; location.hash = '#/'; render(); }
FORM.login = async f => {
  const d = formObj(f);
  const { error } = await S.sb.auth.signInWithPassword({ email: d.email, password: d.password });
  if (error) throw new Error('Wrong email or password, or the email is not confirmed yet.');
  await afterLogin();
};
FORM.activate = async f => {
  const d = formObj(f);
  if (d.password.length < 8) throw new Error('Password must be at least 8 characters');
  if (d.password !== d.password2) throw new Error('Passwords do not match');
  const { data, error } = await S.sb.auth.signUp({ email: d.email, password: d.password, options: { emailRedirectTo: location.origin + location.pathname } });
  if (error) throw new Error('Could not activate. Check that HR has added this exact work email, or try logging in if you already activated.');
  if (data.session) { toast('Account activated', 'ok'); await afterLogin(); }
  else { toast('Check your email and click the confirmation link, then log in.', 'ok'); S.ui.authMode = 'login'; render(); }
};
FORM.forgot = async f => {
  const d = formObj(f);
  const { error } = await S.sb.auth.resetPasswordForEmail(d.email, { redirectTo: location.origin + location.pathname });
  if (error) throw error;
  toast('If this email is registered, a reset link is on its way.', 'ok'); S.ui.authMode = 'login'; render();
};
FORM.newpass = async f => {
  const d = formObj(f);
  if (d.password.length < 8) throw new Error('Password must be at least 8 characters');
  if (d.password !== d.password2) throw new Error('Passwords do not match');
  const { error } = await S.sb.auth.updateUser({ password: d.password }); if (error) throw error;

};

function route() {
  let h = location.hash.replace(/^#\/?/, '');
  if (/access_token|type=recovery|error_description/.test(h)) h = '';
  const [name, ...rest] = h.split('/'); return { name: name || 'home', arg: rest.join('/') };
}
async function render() {
  const app = $('#app'); const tok = ++S.tok;
  if (!S.sb) { app.innerHTML = setupScreen(); return; }
  if (S.recovery) { app.innerHTML = authView('recovery'); return; }
  if (!S.user) {
    if (!S.brand) { try { const b = await S.sb.rpc('branding'); S.brand = (b.data && b.data[0]) || null; } catch (_) { } }
    if (tok !== S.tok) return; app.innerHTML = authView(S.ui.authMode || 'login'); return;
  }
  if (!S.me) { app.innerHTML = noProfileView(); return; }
  const { name, arg } = route(); const def = PAGES[name] || PAGES.home;
  if ((def.admin && !isAdmin()) || (def.mgr && !isMgr())) { location.hash = '#/'; return; }
  app.innerHTML = layout(def.title, PAGES[name] ? name : 'home');
  $('#content').innerHTML = '<div class="empty">Loading…</div>';
  try {
    const out = await def.fn(arg); if (tok !== S.tok) return;
    $('#content').innerHTML = out.html; if (out.title) $('#ttl').textContent = out.title; if (out.after) out.after();
  } catch (e) { if (tok === S.tok) $('#content').innerHTML = `<div class="note warn">Something went wrong: ${esc(e.message || e)}</div>`; console.error(e); }
}

/* ===== event wiring (delegation) ===== */
async function guard(fn, btn) {
  if (btn) { if (btn.disabled) return; btn.disabled = true; }
  try { await fn(); } catch (e) { console.error(e); toast(e.message || String(e), 'bad'); } finally { if (btn) btn.disabled = false; }
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  if (t.tagName === 'A') e.preventDefault();
  const f = ACT[t.dataset.act]; if (f) guard(() => f(t, e), t.tagName === 'BUTTON' ? t : null);
});
document.addEventListener('click', e => { const r = e.target.closest('tr[data-href]'); if (r && !e.target.closest('a,button,input,select')) location.hash = r.dataset.href; });
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault();
  const h = FORM[f.dataset.form]; if (h) guard(() => h(f), f.querySelector('button[type=submit]'));
});
document.addEventListener('change', e => { const t = e.target.closest('[data-chg]'); if (t && CHG[t.dataset.chg]) guard(() => CHG[t.dataset.chg](t)); });
document.addEventListener('input', e => {
  const t = e.target.closest('[data-filter]'); if (!t) return;
  const q = t.value.toLowerCase(); $$(`#${t.dataset.filter} tr[data-s]`).forEach(r => r.classList.toggle('hide', !!q && !r.dataset.s.includes(q)));
});
window.addEventListener('hashchange', () => { if (S.user) render(); });

function isLate(ts) {
  const [h, m] = (S.st.work_start_time || '09:30').split(':').map(Number);
  const parts = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: TZ() }).formatToParts(new Date(ts));
  const hh = +parts.find(x => x.type === 'hour').value % 24, mm = +parts.find(x => x.type === 'minute').value;
  return hh * 60 + mm > h * 60 + m + (S.st.late_grace_minutes ?? 15);
}

FORM.leaveApply = async f => {
  const d = formObj(f), half = d.half_day === '1';
  if (d.to_date < d.from_date) throw new Error('"To" date cannot be before "From" date');
  if (half && d.from_date !== d.to_date) throw new Error('Half day is only for a single date');
  const days = countDays(d.from_date, d.to_date, half);
  if (days <= 0) throw new Error('The selected dates are weekly offs or holidays, so no leave is needed');
  const mine = await must(S.sb.from('leave_requests').select('*').eq('employee_id', S.me.id).in('status', ['pending', 'approved']));
  if (mine.some(r => r.from_date <= d.to_date && r.to_date >= d.from_date)) throw new Error('You already have a leave request on these dates');
  const t = S.lt.find(x => x.id === d.leave_type_id);
  if (t.annual_quota != null) {
    const ly = leaveYear(), used = mine.filter(r => r.leave_type_id === t.id && r.from_date >= ly.from && r.from_date <= ly.to).reduce((n, r) => n + num(r.days), 0);
    if (used + days > t.annual_quota) throw new Error(`Not enough ${t.name} left (${t.annual_quota - used} day(s)). Choose Loss of Pay or a shorter period.`);
  }
  await must(S.sb.from('leave_requests').insert({ employee_id: S.me.id, leave_type_id: t.id, from_date: d.from_date, to_date: d.to_date, days, half_day: half, reason: nn(d.reason), status: 'pending' }));
  toast(`Leave request for ${days} day(s) sent`, 'ok'); render();
};

  return { html: `<div class="card pad0"><div class="hd"><h2>Last ${rows.length} changes</h2><span class="muted small">Who changed profile, salary, payslip, settings and document records</span></div><div class="bd scroll">
    ${rows.length ? `<table><tr><th>When</th><th>Who</th><th>What</th><th>Record</th><th>Detail</th></tr>${rows.map(r => { const d = r.new_data || r.old_data || {};
      return `<tr><td>${fdate(r.at)} ${ftime(r.at)}</td><td>${esc(who[r.actor_id] || (r.actor_id ? 'Unknown user' : 'System'))}</td><td>${label[r.table_name] || r.table_name}</td><td>${esc(nm[d.employee_id] || nm[r.record_id] || d.full_name || '')}</td><td class="muted small">${esc(diff(r))}</td></tr>`; }).join('')}</table>` : '<div class="empty">No changes recorded yet.</div>'}</div></div>` };
} };

boot();

</script>
</body>
</html>
